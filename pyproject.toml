[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robofactory-worldagents"
version = "0.1.0"
description = "RoboFactory environments with multi-robot wrist-camera configurations"
requires-python = ">=3.10,<3.11"
dependencies = ["mani_skill==3.0.0b12", "sapien==3.0.0b1", "setuptools<81", "PyYAML>=6,<7", "mplib==0.1.1", "toppra==0.6.10", "imageio-ffmpeg==0.6.0", "transforms3d==0.4.2"]

[tool.setuptools.packages.find]
include = ["robofactory*"]
exclude = ["robofactory.policy*"]

[tool.setuptools.package-data]
robofactory = ["configs/**/*.yaml"]
